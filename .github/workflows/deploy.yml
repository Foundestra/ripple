# Test, build and roll out Ripple to Cloud Run on every push to main.
# Authenticates to Google Cloud with Workload Identity Federation (no keys).
# The vars.* values come from `terraform output github_actions_variables`
# (set automatically when manage_github = true).
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPO }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Roll out both containers (Ripple + OTel mock sidecar)
        run: |
          gcloud run services update "${{ vars.GCP_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --container ripple --image "$IMAGE" \
            --container otel-mock --image "$IMAGE"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${{ vars.GCP_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          curl -fsS "$URL/healthz"
          echo "Deployed $IMAGE to $URL" >> "$GITHUB_STEP_SUMMARY"
