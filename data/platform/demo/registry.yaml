shared_contract_files:
  - pb/demo.proto
path_classifications:
  generated:
    - pattern: genproto/
      match: contains_or_prefix
    - pattern: _pb2.py
      match: contains_or_prefix
    - pattern: _pb2_grpc.py
      match: contains_or_prefix
    - pattern: .pb.go
      match: contains_or_prefix
  documentation:
    - pattern: README.md
      match: basename
    - pattern: docs/
      match: prefix
  shared_contract:
    - pattern: pb/demo.proto
      match: exact
unresolved_alias_types:
  - type: kubernetes_workload
    status: unresolved
    reason: No Kubernetes identity fixture is available.
  - type: datadog_service
    status: unresolved
    reason: No Datadog adapter or fixture is available.
  - type: pagerduty_service
    status: unresolved
    reason: Incident data is seeded and has no PagerDuty service identity.
  - type: deployment_unit
    status: unresolved
    reason: No deployment identity fixture is available.
